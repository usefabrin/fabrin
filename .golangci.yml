version: "2"

# Boundary rules and lint config. CONTRIBUTING.md documents the rules for humans;
# this file is the enforcement. If you change a rule, prove it still bites:
# inject a throwaway violation, watch `just arch` fail, revert. A rule that
# matches nothing is indistinguishable from a rule that passes.

linters:
  enable:
    - depguard
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused

  settings:
    depguard:
      # ── Public package inventory ──────────────────────────────────────────
      # Every package in scripts/gates/public-packages.txt needs one
      # `# boundary: <name> — <decision>` line below, and
      # check-depguard-coverage.sh enforces that.
      #
      # Why an inventory at all: depguard's `files:` and `pkg:` entries are PREFIX
      # matches, not globs. "Every root-level package" is inexpressible, so the
      # rules below are a hand-written enumeration, and a hand-written enumeration
      # fails open — the package nobody remembered stays unguarded while lint
      # reports green over a subset of the tree.
      #
      # Why the rigid `# boundary:` prefix: the check used to grep for the bare
      # package name "mentioned anywhere in this file", which fails open on a
      # substring (`orm` matches `formatters:` below). A marker prose cannot
      # satisfy is the whole point. See #14.
      #
      # Entries. A decision of "no rules" is a valid decision — it just has to be
      # written down, so that considered and forgotten stay distinguishable.
      #
      # boundary: root — no deny rules. This is the one place Gin belongs:
      #     fabrin.Context is a type alias for gin.Context, so the router surface
      #     lives here by definition. The root package's discipline is enforced on
      #     its exported surface by apicheck, not by import restrictions.
      #
      # boundary: config — must not import Gin or net/http (config-is-transport-free)
      #     and must not import the root package (config-is-standalone). Settings
      #     load from a CLI, a test, or a migrate-only process, none of which should
      #     have to construct an HTTP stack first. It holds the Options declaration
      #     that the root package aliases, so the dependency runs root → config.
      #
      # boundary: health — must not import the root package or a sibling
      #     (health-is-standalone). It DOES import Gin, legitimately: its liveness
      #     and readiness handlers are gin.HandlerFunc by definition, which is the
      #     carve-out hard rule 1 makes explicit. Containment is about the exported
      #     surface, enforced by apicheck, not about who may import Gin.
      #
      # boundary: logging — must not import the root package or a sibling
      #     (logging-is-standalone). Imports Gin for the same reason health does:
      #     RequestID and Logger are middleware. It is a leaf so that a CLI or a
      #     worker can build the same structured logger without an HTTP stack.
      #
      # boundary: cli — must not import the root package or a sibling
      #     (cli-is-standalone). The root package imports it to declare Commander
      #     (Commands() []cli.Command), so cli importing root is a genuine cycle
      #     the compiler already rejects. This rule is for the SIBLING import,
      #     which compiles cleanly and would make `fabrin -h` require an HTTP
      #     stack, an ORM, or whatever else got pulled in. It does NOT import Gin:
      #     unlike health and logging, nothing here is a handler. See ADR 0001 for
      #     why Command is Fabrin's own type rather than a third-party one.
      #
      # Packages land as each epic progresses; each arrives with its own line.
      # ──────────────────────────────────────────────────────────────────────
      rules:
        # Settings must load without a server. The CLI parses them, tests build
        # them, and a migrate-only process needs them — none of which should have
        # to construct an HTTP stack first. This is also what keeps config
        # importable from anywhere without dragging in a transport.
        config-is-transport-free:
          files:
            - "**/config/**"
          deny:
            - pkg: "github.com/gin-gonic/gin"
              desc: "config must stay transport-free: settings load without a server (see CONTRIBUTING.md)"
            - pkg: "net/http"
              desc: "config must stay transport-free: settings load without a server (see CONTRIBUTING.md)"

        # config and logging sit below the root package, which imports them. The
        # reverse would be an import cycle — and for config it is a tempting one to
        # write, since it produces fabrin.Options.
        #
        # What these rules actually buy, which is not what their names suggest:
        #
        # The `pkg` prefix match means "github.com/usefabrin/fabrin" matches every
        # SUBpackage too, not just the root. Kept deliberately — and it turns out to
        # be where all the value is. A non-test file in config/ importing the ROOT
        # package is a genuine import cycle, and the Go compiler rejects it before
        # any linter runs, so depguard adds nothing there. What the compiler cannot
        # catch is config importing a SIBLING (fabrin/health, fabrin/orm): no cycle,
        # compiles cleanly, and quietly makes the settings loader depend on half the
        # framework. Verified both ways — a sibling import fails this rule while
        # `go build ./config/` succeeds on the same code.
        #
        # The _test.go exclusion fixes a false positive: an external test package
        # (package config_test) imports the package under test, so
        # config/config_test.go importing .../fabrin/config trips the prefix. That is
        # not a library dependency — the test binary is compiled separately — and a
        # real cycle from an internal test file is still rejected by the compiler.
        config-is-standalone:
          files:
            - "**/config/**"
            - "!**/*_test.go"
          deny:
            - pkg: "github.com/usefabrin/fabrin"
              desc: "config must not import the root package or any other Fabrin package: it is a leaf that the root package imports (see CONTRIBUTING.md)"

        logging-is-standalone:
          files:
            - "**/logging/**"
            - "!**/*_test.go"
          deny:
            - pkg: "github.com/usefabrin/fabrin"
              desc: "logging must not import the root package or any other Fabrin package: it is a leaf that the root package imports (see CONTRIBUTING.md)"

        # health is a leaf for the same reasons, with one extra consequence worth
        # stating: the root package imports health to declare the Checker interface
        # (Checks() []health.Check), so health importing root would be a genuine
        # cycle. The compiler catches that one. What it does not catch — and what
        # this rule is actually for — is health importing a SIBLING, which compiles
        # cleanly and quietly makes the readiness endpoint depend on the ORM.
        health-is-standalone:
          files:
            - "**/health/**"
            - "!**/*_test.go"
          deny:
            - pkg: "github.com/usefabrin/fabrin"
              desc: "health must not import the root package or any other Fabrin package: the root package imports it to declare Checker (see CONTRIBUTING.md)"

        # cli is a leaf for the same reason health is: the root package imports it
        # to declare Commander (Commands() []cli.Command). Same division of labour
        # too — the compiler rejects the root import as a cycle, and this rule is
        # for the sibling import that compiles cleanly.
        #
        # The stake here is specific: a CLI that cannot print its own help without
        # first constructing an App is a CLI nobody can test, and `fabrin new` runs
        # in a directory where no App exists at all.
        cli-is-standalone:
          files:
            - "**/cli/**"
            - "!**/*_test.go"
          deny:
            - pkg: "github.com/usefabrin/fabrin"
              desc: "cli must not import the root package or any other Fabrin package: the root package imports it to declare Commander (see CONTRIBUTING.md)"

        # internal/ is implementation detail for the public packages, so the
        # dependency runs public → internal. Reversing it makes the root package
        # unimportable from its own internals and hides cycles behind the
        # unexported boundary.
        #
        # Scope is internal/** only. fabrintest legitimately imports the root
        # package — it constructs an App — and must not be caught here.
        internal-does-not-import-root:
          files:
            - "**/internal/**"
          deny:
            - pkg: "github.com/usefabrin/fabrin"
              desc: "internal/ must not import the root package: the dependency runs public → internal"

  exclusions:
    rules:
      # Examples exist to be read. Ignoring an error inline would be the
      # realistic thing to lint for in application code and the wrong thing to
      # show a newcomer, so they are held to the same standard as the framework —
      # no exclusion here on purpose. This block is a placeholder for exclusions
      # that turn out to be genuinely warranted; add none speculatively.
      []

formatters:
  enable:
    - gofmt

issues:
  # A framework's lint output is read by contributors who did not write the code.
  # Truncating it hides the second half of the work.
  max-issues-per-linter: 0
  max-same-issues: 0
