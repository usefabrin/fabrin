name: CI

# Guards main and every PR targeting it.
#
# The one rule for this file: it must NOT re-implement the gates. The `quality`
# job runs `just ci` and nothing else. Contributors run `just check` locally, and
# `ci` is an alias for `check`, so the local command exactly matches that job.
# Range-aware docs, race instrumentation, and benchmarks remain explicit jobs.
#
# Three things run outside `just ci`, because they need a git range, isolated
# instrumentation, or a schedule a gate should not have:
#   docs-guard  needs the PR's base..head range
#   race        instruments the suite independently from ordinary diagnostics
#   bench       runs on main only; benchmark numbers from a shared CI runner are
#               too noisy to gate a PR on, but the trend over main is worth having

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOFLAGS: -mod=mod

jobs:
  quality:
    name: Gates · Lint · Test · Arch · API · Examples · Specs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Pinned to the version in go.mod. A library should build on the oldest
      # toolchain it claims to support, so this deliberately is not "stable".
      # Both go.sum files: `just ci` builds the tools/ module too, and setup-go
      # keys its cache on the paths listed here. Leaving tools/go.sum out does not
      # break the build — it just refetches golang.org/x/tools on every run.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum

      # Pinned for the same reason golangci-lint is: an unpinned command runner can
      # change recipe semantics with no commit to this repo.
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: '1.57.0'

      # golangci-lint's version lives in the justfile, so local and CI run the
      # same ruleset. This is the single install path.
      - name: Install pinned tools
        run: just tools

      - name: just ci
        run: just ci

  docs-guard:
    name: Docs freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fetch-depth: 0 because the check diffs base..head, and a shallow clone
      # does not contain the base commit — the script would fail on a missing
      # object rather than on a missing doc update.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Governed-surface changes carry their docs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bash scripts/check-docs-freshness.sh "$BASE" "$HEAD"
          else
            bash scripts/check-docs-freshness.sh "$PUSH_BASE" "$PUSH_HEAD"
          fi

  race:
    name: Race detector
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: '1.57.0'

      - name: just race
        run: just race

  bench:
    name: Benchmarks (framework overhead vs raw Gin)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: '1.57.0'

      # Informational, never a gate. Shared runners vary enough between jobs that
      # a threshold here would fail on neighbours' noise; perf/BASELINE.md is
      # where a real regression gets recorded and argued about.
      - name: just bench
        run: just bench
