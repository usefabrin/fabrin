# Fabrin behaviour specification
#
# One entry per load-bearing behaviour. Each cites the requirement it satisfies
# and, once implemented, the test that holds it up. `just specs` fails when an
# entry marked `implemented` names a test file or function that does not exist,
# when an id has no row in test-matrix.md, or when the matrix has a row for an id
# that is not here.
#
# The format is deliberately flat and greppable: the gate needs no YAML parser, so
# it stays fast enough for the pre-commit hook and adds no dependency.
#
# status: planned | implemented
# test:   <file>::<TestFunc>   (required once implemented)

behaviours:
  # ── Core: registration ──────────────────────────────────────────────────────
  - id: CORE-001
    what: Registering two modules with the same name fails at construction.
    why: A duplicate name means one module's routes silently shadow another's. Failing at first request instead of at construction moves the discovery to production.
    requirement: FR-CORE-2
    status: implemented
    test: module_test.go::TestNew_RejectsDuplicateModuleNames

  - id: CORE-002
    what: Optional module interfaces are discovered by type assertion, and the registry reports which ones each module matched.
    why: A mistyped method name means the interface is silently not satisfied — the module simply never runs its Start or contributes its checks.
    requirement: FR-CORE-6
    status: implemented
    test: module_test.go::TestApp_ReportsOptionalInterfacesEachModuleMatched

  # ── Core: lifecycle ─────────────────────────────────────────────────────────
  - id: CORE-003
    what: App.Run shuts down gracefully on context cancellation and on SIGINT/SIGTERM, within a bounded window.
    why: An unbounded shutdown hangs a deploy; no shutdown drops in-flight requests.
    requirement: FR-CORE-3
    status: implemented
    test: fabrin_test.go::TestApp_RunReturnsWhenContextCancelled

  - id: CORE-004
    what: Lifecycle.Stop runs in reverse registration order.
    why: A module built after its dependency must shut down before it, or it tears down against something already gone. The ORDER is the behaviour — a test that only asserts Stop was called would pass on a broken implementation.
    requirement: FR-CORE-4
    status: implemented
    test: module_test.go::TestApp_StopsLifecycleModulesInReverseRegistrationOrder

  # ── Modules: deployment shapes ──────────────────────────────────────────────
  - id: MOD-001
    what: FABRIN_MODULES mounts only the named modules; routes of unmounted modules return 404.
    why: This is the process-slicing claim. One binary, N deployment shapes.
    requirement: FR-MODULES-1
    status: implemented
    test: module_test.go::TestNew_MountsOnlySelectedModules

  - id: MOD-002
    what: A name in FABRIN_MODULES matching no registered module is a startup error.
    why: A typo that silently serves nothing is worse than a crash, because the process passes its liveness probe while doing no work.
    requirement: FR-MODULES-2
    status: implemented
    test: module_test.go::TestNew_RejectsSelectionNamingUnregisteredModule

  - id: MOD-003
    what: A module depends on another module's capability through an interface it declares itself, never by importing that module.
    why: The declared interface is the seam along which the module can move to another process. A direct import welds them together, invisibly, until someone tries to split them.
    requirement: FR-MODULES-3
    status: implemented
    test: examples/hello/hello_test.go::TestModules_NeverImportEachOther

  # ── Config ──────────────────────────────────────────────────────────────────
  - id: CFG-001
    what: Settings resolve defaults then file then environment then flags, each layer overriding the previous.
    why: The documented precedence is the contract; getting it backwards silently ignores production overrides.
    requirement: FR-CONFIG-1
    status: implemented
    test: config/config_test.go::TestLoad_EachLayerWinsOverThePreviousOne

  - id: CFG-002
    what: Each resolved value reports which layer set it.
    why: Without provenance you can see the wrong value but not where it came from, which is most of the debugging time.
    requirement: FR-CONFIG-2
    status: implemented
    test: config/config_test.go::TestLoad_ReportsWhichLayerSetEachValue

  - id: CFG-003
    what: An unparseable value fails at load with the key named, not at first use.
    why: Failing late means failing in production after a green deploy.
    requirement: FR-CONFIG-3
    status: implemented
    test: config/config_test.go::TestLoad_RejectsUnparseableValueNamingTheKey

  - id: CFG-004
    what: FABRIN_ADDR sets the listen address and defaults to :8080.
    why: scripts/smoke-examples.sh relies on it to give each example its own port; without it every example collides and the smoke gate passes on the first one only.
    requirement: FR-CONFIG-4
    status: implemented
    test: config/config_test.go::TestLoad_DefaultsAddrToDocumentedValue

  - id: CFG-005
    what: Load or Resolve with no sources is an error naming Standard() and Defaults(), never a silent defaults-only load.
    why: A main() written the obvious way would start, serve, and ignore every FABRIN_ variable with no diagnostic anywhere — the same silent no-op this codebase rejects for an unknown key and an unknown module name.
    requirement: FR-CONFIG-1
    status: implemented
    test: config/config_test.go::TestLoad_RejectsAnEmptySourceList

  - id: CFG-006
    what: Standard() returns the conventional stack as separate layers, so per-layer provenance survives.
    why: One composite source would report every value as coming from "standard", discarding the answer to "which layer set this" — most of the debugging time on a misconfigured deploy.
    requirement: FR-CONFIG-2
    status: implemented
    test: config/config_test.go::TestStandard_KeepsPerLayerProvenance

  # ── Health ──────────────────────────────────────────────────────────────────
  - id: HLT-001
    what: /healthz reports liveness and consults no module checks.
    why: A liveness probe that fails on a slow dependency causes a restart loop that cannot fix the dependency.
    requirement: FR-HEALTH-1
    status: implemented
    test: health_logging_test.go::TestHealthz_StaysUpWhileAModuleCheckIsFailing

  - id: HLT-002
    what: /readyz aggregates module checks and fails closed, naming the failing module and check.
    why: Reporting ready while a dependency is unreachable takes traffic the process cannot serve.
    requirement: FR-HEALTH-2
    status: implemented
    test: health_logging_test.go::TestReadyz_FailsClosedAndNamesTheFailingModuleAndCheck

  - id: HLT-003
    what: Readiness consults only the modules this process MOUNTED, not every registered one.
    why: Process slicing must extend to readiness; otherwise one deployment shape is gated on a dependency it has no stake in.
    requirement: FR-HEALTH-2
    status: implemented
    test: health_logging_test.go::TestReadyz_OnlyConsultsMountedModules

  # ── Logging ─────────────────────────────────────────────────────────────────
  - id: LOG-001
    what: Every request carries a request id, on the context and in a response header.
    why: A user reporting an error can quote the header, which is the only way to find their request among thousands.
    requirement: FR-LOG-2
    status: implemented
    test: health_logging_test.go::TestRequestID_ReachesTheHandlerContext

  - id: LOG-002
    what: An inbound X-Request-ID is honoured rather than replaced.
    why: A trace started by an upstream proxy or another service must survive the hop, or a request becomes uncorrelatable the moment it crosses a service boundary.
    requirement: FR-LOG-2
    status: implemented
    test: logging/logging_test.go::TestRequestID_HonoursInboundIDSoTracesSurviveAHop

  - id: LOG-003
    what: A hostile inbound X-Request-ID is discarded and replaced with a fresh one.
    why: The id reaches log files and response headers, so an unvalidated one is a header-injection and log-forging vector; generating a fresh id is always a valid answer.
    requirement: FR-LOG-2
    status: implemented
    test: logging/logging_test.go::TestRequestID_RejectsHostileInboundValues

  - id: LOG-004
    what: FABRIN_LOG_FORMAT and FABRIN_LOG_LEVEL reach the logger that serves requests.
    why: A settings key that resolves and validates but changes nothing is the same defect class as one referenced but never implemented.
    requirement: FR-LOG-1
    status: implemented
    test: health_logging_test.go::TestNew_BuildsTheLoggerFromLogLevel

  # ── Public API discipline ───────────────────────────────────────────────────
  - id: API-001
    what: An exported signature naming a third-party type outside the allowlist fails api-check.
    why: An unblessed type in the public API makes that dependency's version part of Fabrin's semver contract, permanently and by accident.
    requirement: INV-1
    status: implemented
    test: tools/apicheck/apicheck_test.go::TestLeak_FindsUnblessedTypesInEveryPosition

  # The failing mechanism here is `diff -u` in scripts/api.sh, so the script IS the
  # test — a Go test wrapping diff would be testing diff. What needs proving in Go
  # is the half diff cannot check: that the rendered snapshot is faithful, since a
  # symbol the renderer drops can be removed from the API without a word. That is
  # TestDescribe_RecordsEveryExportedKindAndNothingUnexported, and the gate's own
  # failure is evidenced by the injected-violation transcript in the PR (#10).
  - id: API-002
    what: A change to the exported surface without a regenerated api/fabrin.txt fails api-check.
    why: A rename that passes tests and lint still breaks every downstream build.
    requirement: INV-2
    status: implemented
    test: scripts/api.sh

  - id: API-003
    what: The snapshot records type aliases unexpanded, so a Gin patch bump does not change api/fabrin.txt.
    why: Expanding gin.Context's methods would turn api-check red on dependency updates that change nothing about Fabrin. A gate that cries wolf gets ignored.
    requirement: INV-2
    status: implemented
    test: tools/apicheck/apicheck_test.go::TestDescribe_RecordsAliasesUnexpanded

  # ── The command surface ─────────────────────────────────────────────────────
  - id: CLI-001
    what: An unknown command is an error naming the closest match and listing the rest.
    why: A typo that exits 0 is the worst outcome available, because the user believes the command ran. Same rule FABRIN_MODULES follows for an unknown module name.
    requirement: FR-CLI-4
    status: implemented
    test: cli/cli_test.go::TestDispatch_RejectsUnknownCommandNamingTheClosestMatch

  - id: CLI-002
    what: Each command's flags are parsed into a FlagSet of its own; nothing is registered globally.
    why: Two modules must be able to define -format without colliding, and a module contributing a command must not be able to change another's parsing.
    requirement: FR-CLI-4
    status: implemented
    test: cli/cli_test.go::TestDispatch_ParsesFlagsIntoTheCommandsOwnSet

  - id: CLI-003
    what: Dispatch writes nothing to a stream it does not own, including on a flag parse error.
    why: flag.ContinueOnError stops the FlagSet calling os.Exit but not printing to os.Stderr. A library writing there duplicates whatever the caller does with the returned error, and cannot be tested without swapping globals.
    requirement: FR-CLI-4
    status: implemented
    test: cli/cli_test.go::TestDispatch_WritesNothingToStderrOnAFlagParseError

  - id: CLI-004
    what: Every mounted route is attributed to the module that mounted it, with framework routes marked as such.
    why: '"Which module owns this URL" cannot be answered from the engine alone — Gin records a handler name, which for a closure is an unhelpful pkg.func1. Attributing /healthz to whichever module mounted first would be a lie that surfaces only when someone goes looking.'
    requirement: FR-CLI-3
    status: implemented
    test: execute_test.go::TestApp_RoutesAttributesEachRouteToItsModule

  - id: CLI-005
    what: Execute with no arguments serves, and a leading flag is treated as a setting rather than a command.
    why: Anything else silently changes what ./myapp does the moment its main switches from Run to Execute. A container that used to serve would print usage and exit 0, which every orchestrator reads as a successful run.
    requirement: FR-CLI-3
    status: implemented
    test: execute_test.go::TestApp_ExecuteWithNoArgumentsServes

  - id: CLI-006
    what: Gin's debug output is silenced unless Options.Debug is set, and GIN_MODE overrides both.
    why: Gin's zero configuration prints a warning banner and the whole route table to stdout on construction — four lines of garbage above a routes listing, and a needless disclosure of internal handler paths in a container log. Differ from the library's default when the library's default is unsafe. It is also what finally makes Options.Debug change behaviour rather than merely resolve.
    requirement: NFR-7
    status: implemented
    test: execute_test.go::TestNew_SilencesGinsDebugOutputUnlessDebugIsSet

  - id: CLI-007
    what: A module contributes subcommands through Commander, collected from the mounted modules only.
    why: Django's management commands, and the reason fabrin/cli is its own package. A module this process did not mount registered nothing, so offering its command would advertise work this process cannot do.
    requirement: FR-CLI-4
    status: implemented
    test: commander_test.go::TestNew_CollectsCommandsFromMountedModulesOnly

  - id: CLI-008
    what: A command name colliding with a built-in or with another module's command fails at construction, naming both sides.
    why: Found at dispatch instead, a shadowed `routes` is a command that suddenly does something else, and which of the two wins depends on slice order — correct on the machine where it was written.
    requirement: FR-CLI-4
    status: implemented
    test: commander_test.go::TestNew_RejectsAModuleCommandThatShadowsABuiltIn

  - id: CLI-009
    what: Flags are parsed wherever they appear relative to a command's positional arguments, and everything after a bare "--" is passed through untouched.
    why: Go's flag package stops at the first non-flag argument, which is right for a program's own arguments and wrong for a subcommand whose name has already been consumed. Without this, `fabrin new demo -module example.com/demo` treats the module path as a second project name.
    requirement: FR-CLI-4
    status: implemented
    test: cli/cli_test.go::TestDispatch_ParsesFlagsWhereverTheyAppear

  - id: CLI-010
    what: '`fabrin new <name>` writes a project that builds, tests, and boots, refusing a non-empty directory and an unusable name.'
    why: A scaffold whose output does not run is worse than no scaffold — the user debugs a framework they have not learned yet. Validation happens before the first write, because a half-written project is harder to recover from than none.
    requirement: FR-CLI-1
    status: implemented
    test: internal/scaffold/scaffold_test.go::TestGenerate_WritesEveryFileTheProjectNeeds

  - id: CLI-011
    what: '`fabrin startapp <name>` writes the module package and wires it into the existing main.go, keeping every module already wired.'
    why: A scaffold that leaves the user to find the wiring point has done the easy half — the module compiles, serves nothing, and nothing says why.
    requirement: FR-CLI-2
    status: implemented
    test: internal/scaffold/module_test.go::TestModule_WiresItselfIntoNewApp

  - id: CLI-012
    what: The wiring edit locates the fabrin.New call with go/ast and splices text at the offsets it reports, leaving the user's formatting and comments untouched and the file gofmt-clean.
    why: A regex is fragile against a user who reformatted or added a comment, and re-printing with go/format would reformat code the user owns — turning "add a module" into a diff nobody wants to review. Inserting an import in the wrong sorted position is not a compile error, so only a gofmt comparison catches it.
    requirement: FR-CLI-2
    status: implemented
    test: internal/scaffold/module_test.go::TestModule_LeavesMainGofmtClean

  - id: CLI-013
    what: The scaffold's own output is generated, built, tested, extended with startapp, and booted by `just check`, against the working tree rather than the published module.
    why: The templates are .tmpl text, invisible to the compiler, so a change to fabrin.New or the Module interface can break them with every other gate green. A replace directive is what makes it the working tree under test — resolving Fabrin from the proxy would go green on a broken scaffold until the change was merged.
    requirement: NFR-5
    status: implemented
    test: scripts/check-scaffold.sh

  # ── Models: the metadata registry ───────────────────────────────────────────
  - id: ORM-001
    what: Two models claiming one table name are rejected at registration, and the error names both modules.
    why: Two modules writing one table is either a mistake or a coupling nobody declared, and the migration generator would otherwise diff against a schema that is the union of two intentions. "Duplicate table" alone means grepping every module for the name, so the module that declared each side is recorded at registration — the only moment it is known for free.
    requirement: FR-ORM-1
    status: implemented
    test: orm/orm_test.go::TestRegistry_RejectsTwoModelsClaimingOneTable

  - id: ORM-002
    what: A model the migration generator could not act on is rejected at registration rather than at DDL time — no table name, no fields, an unnamed or untyped column, a duplicated column, a bad MaxLen, or no primary key.
    why: 'The generator runs against a real database, and a mystery there is a mystery in the most expensive available place. The zero Type is invalid on purpose: a forgotten type must be an error rather than silently becoming whichever constant sorts first.'
    requirement: FR-ORM-1
    status: implemented
    test: orm/orm_test.go::TestRegistry_RejectsAModelWithNothingToMigrate

  - id: ORM-003
    what: Models() is ordered by table name rather than by registration order.
    why: Registration order follows module registration, which follows FABRIN_MODULES and the argument order in main — none of which should reach a generated migration. Sorting makes the generator's output a function of the schema alone.
    requirement: FR-ORM-1
    status: implemented
    test: orm/orm_test.go::TestRegistry_ModelsIsOrderedByTableRatherThanRegistration

  - id: ORM-004
    what: Field order within a model is preserved exactly as declared.
    why: The generator emits columns from this order, so anything unstable — a map, a sort by name — produces a spurious diff on a project nobody changed. That is how a generator earns a reputation for lying, and it is why table order is sorted while field order is not.
    requirement: FR-ORM-1
    status: implemented
    test: orm/orm_test.go::TestRegistry_KeepsFieldOrderAsDeclared

  - id: ORM-005
    what: Models() returns a deep copy, so a caller cannot mutate the registry through what it was handed.
    why: The registry is read by the migration generator, the admin, and forms. A caller that mutated its result would change the schema every later reader sees, with nothing in between to blame.
    requirement: FR-ORM-1
    status: implemented
    test: orm/orm_test.go::TestRegistry_ModelsReturnsACopy

  - id: ORM-006
    what: The orm package holds no database handle — it may not import database/sql, and a sibling Fabrin package is barred too.
    why: Metadata is a description, and the handle belongs to the application. Nothing else stops this package opening a connection, and the moment it can, the admin needs a database running to render a form and these tests need one to run. Enforced by depguard rather than by review, because the import that breaks it compiles cleanly.
    requirement: FR-ORM-1
    status: implemented
    test: .golangci.yml

  - id: ORM-007
    what: A module declares its tables by implementing Modeler, asserted at registration and reported through App.Capabilities like Checker, Lifecycle, and Commander. Fabrin scans no packages for models.
    why: Django discovers models because a Python import has side effects at runtime. The Go equivalent is a blank import whose absence is silent — and a model that quietly fails to register is a table the migration generator proposes to DROP. Explicit hand-over makes the absence a compile-time one.
    requirement: FR-ORM-3
    status: implemented
    test: modeler_test.go::TestApp_ModelsCollectsEachModulesTablesWithItsName

  - id: ORM-008
    what: Models are collected from MOUNTED modules only, following the same process-slicing rule as readiness checks and commands.
    why: A migrate-only process that mounts one module must not be handed another's models, or it generates DDL for tables this deployment shape has no stake in.
    requirement: FR-ORM-3
    status: implemented
    test: modeler_test.go::TestNew_CollectsModelsFromMountedModulesOnly

  - id: ORM-009
    what: Two mounted modules declaring one table name fail at construction, and the error names both modules and the table while still matching errors.Is against orm.ErrDuplicateTable.
    why: Propagated rather than logged, because New fails on wiring mistakes instead of warning about them. Found later, it is found as a generated migration diffing against the union of two intentions. The wrap must preserve errors.Is or a caller has nothing to branch on but message text.
    requirement: FR-ORM-3
    status: implemented
    test: modeler_test.go::TestNew_RejectsTwoModulesDeclaringOneTable

  # ── Migrations ──────────────────────────────────────────────────────────────
  - id: MIG-001
    what: A migration's body and the row recording it are written in one transaction, so a failure leaves both the schema and the applied-state table where they started.
    why: Recording the version outside the transaction is the classic form of this bug — the migration half-runs, the row says it finished, and every later run skips the half that never happened. Migrations that already committed stay applied, and the error names which migration failed so the operator is not guessing at the database's state.
    requirement: FR-ORM-4
    status: implemented
    test: migrate/migrate_test.go::TestRun_LeavesNothingBehindWhenAMigrationFails

  - id: MIG-002
    what: An unapplied migration sorting before one already applied is an error, and nothing is applied.
    why: That is the shape of a branch merged out of order — someone's 002 lands after 003 is already in production. Applying it silently would run it against a schema it was never written against, and the diff it assumed is not the diff it gets. Distinct from FR-ORM-5, which is about two migrations claiming ONE version; this is about one version arriving late.
    requirement: FR-ORM-4
    status: implemented
    test: migrate/migrate_test.go::TestRun_RejectsAMigrationOrderedBeforeOneAlreadyApplied

  - id: MIG-003
    what: Migrations apply in version order regardless of slice order, and applying is idempotent — already-applied migrations are skipped rather than re-run.
    why: 'A caller that globs a directory gets whatever the filesystem returns, which is not a total order. Idempotence is what makes a redeploy safe: an empty result means already up to date, which is the normal case and not an error.'
    requirement: FR-ORM-4
    status: implemented
    test: migrate/migrate_test.go::TestRun_AppliesPendingMigrationsInVersionOrder

  - id: MIG-004
    what: A migration set with a duplicate version, no version, no Up, or no Down is rejected before anything is applied.
    why: A down step is required rather than optional — a migration you cannot reverse is a deploy you cannot roll back, and the moment you need it is the worst moment to find out nobody wrote one. An irreversible change says so from Down, which is a decision recorded in the file rather than an omission.
    requirement: FR-ORM-4
    status: implemented
    test: migrate/migrate_test.go::TestRun_RejectsAnUnusableMigrationSet

  - id: MIG-005
    what: Rollback undoes applied migrations newer than an exclusive target version, newest first, each in its own transaction, and fails rather than skipping a recorded version it has no Down for.
    why: Reverse order because a later migration may depend on an earlier one — undoing 001 before 003 removes what 003's own Down still needs. Skipping a version with no migration in hand would report success while leaving the schema ahead of where the caller asked to be.
    requirement: FR-ORM-4
    status: implemented
    test: migrate/migrate_test.go::TestRollback_UndoesInReverseOrder

  - id: MIG-007
    what: Two migrations claiming one version are rejected before anything is applied, and the error names both.
    why: With several branches in flight this is a matter of when, not if. The engine half is here; the repo-level gate that catches it on the files before they are merged is separate, which is why FR-ORM-5 is not yet done.
    requirement: FR-ORM-5
    status: implemented
    test: migrate/migrate_test.go::TestRun_RejectsAnUnusableMigrationSet

  - id: MIG-008
    what: A repo-level gate, hanging off an existing just recipe, rejects two migration files claiming one version and names both files and the version.
    why: MIG-007 catches the collision at deploy time, against a database, which is the most expensive moment to find it. Two branches each generating an 0004 are both green in isolation, so the only cheap moment is before merge. BLOCKED on the on-disk migration file format - the engine takes migrations as values and nothing reads a directory yet (docs/TODO.md F2), so there are no files for a gate to read and no scheme to validate a filename against. The gate must read the files rather than a registry built by running Go code, or a colliding migration on a branch that does not compile goes uncaught.
    requirement: FR-ORM-5
    status: planned

  - id: MIG-009
    what: A migration set whose versions do not sort as written - mixed-width versions such as 9 and 10 - is rejected before anything is applied, and the error names both.
    why: M documents lexicographic ordering and therefore requires a fixed-width version, but nothing enforces it. Such a set is accepted, reordered into a sequence its author did not write, and applied against a schema each half never saw. Both versions are named because the fault is in the pair - 9 is unimpeachable next to 8. Cites FR-ORM-4 (versioned, ORDERED) rather than FR-ORM-5 although it arrived via issue #55 - these are two distinct versions, neither claiming the other's, so it is an ordering property like MIG-002 and not a collision.
    requirement: FR-ORM-4
    status: implemented
    test: migrate/migrate_test.go::TestRun_RejectsVersionsThatDoNotSortAsWritten

  - id: MIG-006
    what: The migration engine takes a *sql.DB and imports no driver, no Gin, and no net/http, so migrations run from a process that mounts no routes.
    why: A migrate-only process is a deployment shape Fabrin promises, and an engine that dragged in a transport would make the smallest useful migration container carry an HTTP stack it never binds. The driver belongs to the application; Fabrin's own test driver is barred from the shipped code by the same rule that permits it in the tests.
    requirement: FR-ORM-4
    status: implemented
    test: .golangci.yml
