# Fabrin behaviour specification
#
# One entry per load-bearing behaviour. Each cites the requirement it satisfies
# and, once implemented, the test that holds it up. `just specs` fails when an
# entry marked `implemented` names a test file or function that does not exist,
# when an id has no row in test-matrix.md, or when the matrix has a row for an id
# that is not here.
#
# `just specs` parses this as YAML with unknown and duplicate fields rejected,
# validates requirement references, and resolves exact matrix rows and Go test
# functions. The parser lives in the separate tools module.
#
# status: planned | implemented
# test:   <file>::<TestFunc>   (required once implemented)

behaviours:
  # ── Core: registration ──────────────────────────────────────────────────────
  - id: CORE-001
    what: Registering two modules with the same name fails at construction.
    why: A duplicate name means one module's routes silently shadow another's. Failing at first request instead of at construction moves the discovery to production.
    requirement: FR-CORE-2
    status: implemented
    test: module_test.go::TestNew_RejectsDuplicateModuleNames

  - id: CORE-002
    what: Optional module interfaces are discovered by type assertion, and the registry reports which ones each module matched.
    why: A mistyped method name means the interface is silently not satisfied — the module simply never runs its Start or contributes its checks.
    requirement: FR-CORE-6
    status: implemented
    test: module_test.go::TestApp_ReportsOptionalInterfacesEachModuleMatched

  # ── Core: lifecycle ─────────────────────────────────────────────────────────
  - id: CORE-003
    what: App.Run shuts down gracefully on context cancellation and on SIGINT/SIGTERM, within a bounded window.
    why: An unbounded shutdown hangs a deploy; no shutdown drops in-flight requests.
    requirement: FR-CORE-3
    status: implemented
    test: fabrin_test.go::TestApp_RunReturnsWhenContextCancelled

  - id: CORE-004
    what: Lifecycle.Stop runs in reverse registration order.
    why: Fabrin has no dependency graph; main owns registration order. A module registered after a resource it consumes must stop before that resource. The ORDER is the behaviour — a test that only asserts Stop was called would pass on a broken implementation.
    requirement: FR-CORE-4
    status: implemented
    test: module_test.go::TestApp_StopsLifecycleModulesInReverseRegistrationOrder

  # ── Modules: deployment shapes ──────────────────────────────────────────────
  - id: MOD-001
    what: FABRIN_MODULES mounts routes and optional capabilities only for named, already-constructed modules; routes of unmounted modules return 404.
    why: This is route and capability slicing, not lazy construction. The application may have opened dependencies before passing modules to fabrin.New.
    requirement: FR-MODULES-1
    status: implemented
    test: module_test.go::TestNew_MountsOnlySelectedModules

  - id: MOD-002
    what: A name in FABRIN_MODULES matching no registered module is a startup error.
    why: A typo that silently serves nothing is worse than a crash, because the process passes its liveness probe while doing no work.
    requirement: FR-MODULES-2
    status: implemented
    test: module_test.go::TestNew_RejectsSelectionNamingUnregisteredModule

  - id: MOD-003
    what: A module depends on another module's capability through an interface it declares itself, never by importing that module.
    why: The declared interface is the seam along which the module can move to another process. A direct import welds them together, invisibly, until someone tries to split them.
    requirement: FR-MODULES-3
    status: implemented
    test: examples/hello/hello_test.go::TestModules_NeverImportEachOther

  - id: MOD-004
    what: NewFromFactories validates the complete named catalogue and selection before invoking any builder, then builds only selected modules in factory registration order.
    why: Selection after construction cannot prevent excluded modules from opening dependencies; validation first prevents a bad deployment shape from partially constructing before startup fails.
    requirement: FR-MODULES-4
    status: implemented
    test: module_test.go::TestNewFromFactories_DoesNotBuildUnselectedModules

  - id: MOD-005
    what: Starting the runnable hello example with only greet selected never invokes the orders database opener.
    why: The framework-level factory test could stay green while real application wiring still opens every dependency before selection. The example proves the promised deployment shape end to end, including lifecycle startup.
    requirement: FR-MODULES-4
    status: implemented
    test: examples/hello/hello_test.go::TestSlicing_DoesNotOpenAnUnselectedModulesResources

  # ── Config ──────────────────────────────────────────────────────────────────
  - id: CFG-001
    what: Settings resolve defaults then file then environment then flags, each layer overriding the previous.
    why: The documented precedence is the contract; getting it backwards silently ignores production overrides.
    requirement: FR-CONFIG-1
    status: implemented
    test: config/config_test.go::TestLoad_EachLayerWinsOverThePreviousOne

  - id: CFG-002
    what: Each resolved value reports which layer set it.
    why: Without provenance you can see the wrong value but not where it came from, which is most of the debugging time.
    requirement: FR-CONFIG-2
    status: implemented
    test: config/config_test.go::TestLoad_ReportsWhichLayerSetEachValue

  - id: CFG-003
    what: An unparseable value fails at load with the key named, not at first use.
    why: Failing late means failing in production after a green deploy.
    requirement: FR-CONFIG-3
    status: implemented
    test: config/config_test.go::TestLoad_RejectsUnparseableValueNamingTheKey

  - id: CFG-004
    what: FABRIN_ADDR sets the listen address and defaults to :8080.
    why: scripts/smoke-examples.sh relies on it to give each example its own port; without it every example collides and the smoke gate passes on the first one only.
    requirement: FR-CONFIG-4
    status: implemented
    test: config/config_test.go::TestLoad_DefaultsAddrToDocumentedValue

  - id: CFG-005
    what: Load or Resolve with no sources is an error naming Standard() and Defaults(), never a silent defaults-only load.
    why: A main() written the obvious way would start, serve, and ignore every FABRIN_ variable with no diagnostic anywhere — the same silent no-op this codebase rejects for an unknown key and an unknown module name.
    requirement: FR-CONFIG-1
    status: implemented
    test: config/config_test.go::TestLoad_RejectsAnEmptySourceList

  - id: CFG-006
    what: Standard() returns the conventional stack as separate layers, so per-layer provenance survives.
    why: One composite source would report every value as coming from "standard", discarding the answer to "which layer set this" — most of the debugging time on a misconfigured deploy.
    requirement: FR-CONFIG-2
    status: implemented
    test: config/config_test.go::TestStandard_KeepsPerLayerProvenance

  # ── Health ──────────────────────────────────────────────────────────────────
  - id: HLT-001
    what: /healthz reports liveness and consults no module checks.
    why: A liveness probe that fails on a slow dependency causes a restart loop that cannot fix the dependency.
    requirement: FR-HEALTH-1
    status: implemented
    test: health_logging_test.go::TestHealthz_StaysUpWhileAModuleCheckIsFailing

  - id: HLT-002
    what: /readyz aggregates module checks and fails closed, naming the failing module and check.
    why: Reporting ready while a dependency is unreachable takes traffic the process cannot serve.
    requirement: FR-HEALTH-2
    status: implemented
    test: health_logging_test.go::TestReadyz_FailsClosedAndNamesTheFailingModuleAndCheck

  - id: HLT-003
    what: Readiness consults only the modules this process MOUNTED, not every registered one.
    why: Process slicing must extend to readiness; otherwise one deployment shape is gated on a dependency it has no stake in.
    requirement: FR-HEALTH-2
    status: implemented
    test: health_logging_test.go::TestReadyz_OnlyConsultsMountedModules

  - id: HLT-004
    what: Readiness returns within its deadline when a check ignores cancellation and never starts a second invocation while the first remains outstanding.
    why: An endpoint that waits for a non-cooperative dependency outlives the orchestrator probe and leaks another goroutine on every request unless invocation count is bounded.
    requirement: FR-HEALTH-4
    status: implemented
    test: health/health_test.go::TestReadiness_TimesOutRatherThanHanging

  # ── Logging ─────────────────────────────────────────────────────────────────
  - id: LOG-001
    what: Every request carries a request id, on the context and in a response header.
    why: A user reporting an error can quote the header, which is the only way to find their request among thousands.
    requirement: FR-LOG-2
    status: implemented
    test: health_logging_test.go::TestRequestID_ReachesTheHandlerContext

  - id: LOG-002
    what: An inbound X-Request-ID is honoured rather than replaced.
    why: A trace started by an upstream proxy or another service must survive the hop, or a request becomes uncorrelatable the moment it crosses a service boundary.
    requirement: FR-LOG-2
    status: implemented
    test: logging/logging_test.go::TestRequestID_HonoursInboundIDSoTracesSurviveAHop

  - id: LOG-003
    what: A hostile inbound X-Request-ID is discarded and replaced with a fresh one.
    why: The id reaches log files and response headers, so an unvalidated one is a header-injection and log-forging vector; generating a fresh id is always a valid answer.
    requirement: FR-LOG-2
    status: implemented
    test: logging/logging_test.go::TestRequestID_RejectsHostileInboundValues

  - id: LOG-004
    what: FABRIN_LOG_FORMAT and FABRIN_LOG_LEVEL reach the logger that serves requests.
    why: A settings key that resolves and validates but changes nothing is the same defect class as one referenced but never implemented.
    requirement: FR-LOG-1
    status: implemented
    test: health_logging_test.go::TestNew_BuildsTheLoggerFromLogLevel

  - id: LOG-005
    what: A recovered handler panic emits the structured completed-request log with the actual committed status, an explicit panic marker, error level, and the response request id; an uncommitted response becomes 500.
    why: Recovery without request logging hides the failed request from the same structured stream operators use for every other response.
    requirement: FR-LOG-3
    status: implemented
    test: health_logging_test.go::TestRecoveredPanic_IsRequestLoggedWithFailureStatus

  # ── Public API discipline ───────────────────────────────────────────────────
  - id: API-001
    what: An exported signature naming a third-party type outside the allowlist fails api-check.
    why: An unblessed type in the public API makes that dependency's version part of Fabrin's semver contract, permanently and by accident.
    requirement: INV-1
    status: implemented
    test: tools/apicheck/apicheck_test.go::TestLeak_FindsUnblessedTypesInEveryPosition

  # The failing mechanism here is `diff -u` in scripts/api.sh, so the script IS the
  # test — a Go test wrapping diff would be testing diff. What needs proving in Go
  # is the half diff cannot check: that the rendered snapshot is faithful, since a
  # symbol the renderer drops can be removed from the API without a word. That is
  # TestDescribe_RecordsEveryExportedKindAndNothingUnexported, and the gate's own
  # failure is evidenced by the injected-violation transcript in the PR (#10).
  - id: API-002
    what: A change to the exported surface without a regenerated api/fabrin.txt fails api-check.
    why: A rename that passes tests and lint still breaks every downstream build.
    requirement: INV-2
    status: implemented
    test: scripts/api.sh

  - id: API-003
    what: The snapshot records type aliases unexpanded, so a Gin patch bump does not change api/fabrin.txt.
    why: Expanding gin.Context's methods would turn api-check red on dependency updates that change nothing about Fabrin. A gate that cries wolf gets ignored.
    requirement: INV-2
    status: implemented
    test: tools/apicheck/apicheck_test.go::TestDescribe_RecordsAliasesUnexpanded

  # ── The command surface ─────────────────────────────────────────────────────
  - id: CLI-001
    what: An unknown command is an error naming the closest match and listing the rest.
    why: A typo that exits 0 is the worst outcome available, because the user believes the command ran. Same rule FABRIN_MODULES follows for an unknown module name.
    requirement: FR-CLI-4
    status: implemented
    test: cli/cli_test.go::TestDispatch_RejectsUnknownCommandNamingTheClosestMatch

  - id: CLI-002
    what: Each command's flags are parsed into a FlagSet of its own; nothing is registered globally.
    why: Two modules must be able to define -format without colliding, and a module contributing a command must not be able to change another's parsing.
    requirement: FR-CLI-4
    status: implemented
    test: cli/cli_test.go::TestDispatch_ParsesFlagsIntoTheCommandsOwnSet

  - id: CLI-003
    what: Dispatch writes nothing to a stream it does not own, including on a flag parse error.
    why: flag.ContinueOnError stops the FlagSet calling os.Exit but not printing to os.Stderr. A library writing there duplicates whatever the caller does with the returned error, and cannot be tested without swapping globals.
    requirement: FR-CLI-4
    status: implemented
    test: cli/cli_test.go::TestDispatch_WritesNothingToStderrOnAFlagParseError

  - id: CLI-004
    what: Every mounted route is attributed to the module that mounted it, with framework routes marked as such.
    why: '"Which module owns this URL" cannot be answered from the engine alone — Gin records a handler name, which for a closure is an unhelpful pkg.func1. Attributing /healthz to whichever module mounted first would be a lie that surfaces only when someone goes looking.'
    requirement: FR-CLI-3
    status: implemented
    test: execute_test.go::TestApp_RoutesAttributesEachRouteToItsModule

  - id: CLI-005
    what: Execute with no arguments serves, and a leading flag is treated as a setting rather than a command.
    why: Anything else silently changes what ./myapp does the moment its main switches from Run to Execute. A container that used to serve would print usage and exit 0, which every orchestrator reads as a successful run.
    requirement: FR-CLI-3
    status: implemented
    test: execute_test.go::TestApp_ExecuteWithNoArgumentsServes

  - id: CLI-006
    what: Gin's debug output is silenced unless Options.Debug is set, and GIN_MODE overrides both.
    why: Gin's zero configuration prints a warning banner and the whole route table to stdout on construction — four lines of garbage above a routes listing, and a needless disclosure of internal handler paths in a container log. Differ from the library's default when the library's default is unsafe. It is also what finally makes Options.Debug change behaviour rather than merely resolve.
    requirement: NFR-7
    status: implemented
    test: execute_test.go::TestNew_SilencesGinsDebugOutputUnlessDebugIsSet

  - id: CLI-007
    what: A module contributes subcommands through Commander, collected from the mounted modules only.
    why: Django's management commands, and the reason fabrin/cli is its own package. A module this process did not mount registered nothing, so offering its command would advertise work this process cannot do.
    requirement: FR-CLI-4
    status: implemented
    test: commander_test.go::TestNew_CollectsCommandsFromMountedModulesOnly

  - id: CLI-008
    what: A command name colliding with a built-in or with another module's command fails at construction, naming both sides.
    why: Found at dispatch instead, a shadowed `routes` is a command that suddenly does something else, and which of the two wins depends on slice order — correct on the machine where it was written.
    requirement: FR-CLI-4
    status: implemented
    test: commander_test.go::TestNew_RejectsAModuleCommandThatShadowsABuiltIn

  - id: CLI-009
    what: Flags are parsed wherever they appear relative to a command's positional arguments, and everything after a bare "--" is passed through untouched.
    why: Go's flag package stops at the first non-flag argument, which is right for a program's own arguments and wrong for a subcommand whose name has already been consumed. Without this, `fabrin new demo -module example.com/demo` treats the module path as a second project name.
    requirement: FR-CLI-4
    status: implemented
    test: cli/cli_test.go::TestDispatch_ParsesFlagsWhereverTheyAppear

  - id: CLI-010
    what: '`fabrin new <name>` writes a project that builds, tests, and boots, refusing a non-empty directory and an unusable name.'
    why: A scaffold whose output does not run is worse than no scaffold — the user debugs a framework they have not learned yet. Validation happens before the first write, because a half-written project is harder to recover from than none.
    requirement: FR-CLI-1
    status: implemented
    test: internal/scaffold/scaffold_test.go::TestGenerate_WritesEveryFileTheProjectNeeds

  - id: CLI-011
    what: '`fabrin startapp <name>` writes the module package and wires it into the existing main.go, keeping every module already wired.'
    why: A scaffold that leaves the user to find the wiring point has done the easy half — the module compiles, serves nothing, and nothing says why.
    requirement: FR-CLI-2
    status: implemented
    test: internal/scaffold/module_test.go::TestModule_WiresItselfIntoNewApp

  - id: CLI-012
    what: The wiring edit locates the fabrin.New call with go/ast and splices text at the offsets it reports, leaving the user's formatting and comments untouched and the file gofmt-clean.
    why: A regex is fragile against a user who reformatted or added a comment, and re-printing with go/format would reformat code the user owns — turning "add a module" into a diff nobody wants to review. Inserting an import in the wrong sorted position is not a compile error, so only a gofmt comparison catches it.
    requirement: FR-CLI-2
    status: implemented
    test: internal/scaffold/module_test.go::TestModule_LeavesMainGofmtClean

  - id: CLI-013
    what: The scaffold's own output is generated, built, tested, extended with startapp, and booted by `just check`, against the working tree rather than the published module.
    why: The templates are .tmpl text, invisible to the compiler, so a change to fabrin.New or the Module interface can break them with every other gate green. A replace directive is what makes it the working tree under test — resolving Fabrin from the proxy would go green on a broken scaffold until the change was merged.
    requirement: NFR-5
    status: implemented
    test: scripts/check-scaffold.sh

  - id: CLI-014
    what: A generated application prints usage and exits successfully for help anywhere in the initial configuration-flag prefix, while an invalid leading flag exits with a normal parse error rather than a panic.
    why: Configuration loads before App.Execute; mishandling flag.ErrHelp panics before usage, while checking only the first argument can turn `-addr :9000 -h` into a running server.
    requirement: FR-CLI-5
    status: implemented
    test: scripts/check-scaffold.sh

  # ── Models: the metadata registry ───────────────────────────────────────────
  - id: ORM-001
    what: Two models claiming one table name are rejected at registration, and the error names both modules.
    why: Two modules writing one table is either a mistake or a coupling nobody declared, and the migration generator would otherwise diff against a schema that is the union of two intentions. "Duplicate table" alone means grepping every module for the name, so the module that declared each side is recorded at registration — the only moment it is known for free.
    requirement: FR-ORM-1
    status: implemented
    test: orm/orm_test.go::TestRegistry_RejectsTwoModelsClaimingOneTable

  - id: ORM-002
    what: A model the migration generator could not act on is rejected at registration rather than at DDL time — no table name, no fields, an unnamed or untyped column, a duplicated column, a bad MaxLen, or no primary key.
    why: 'The generator runs against a real database, and a mystery there is a mystery in the most expensive available place. The zero Type is invalid on purpose: a forgotten type must be an error rather than silently becoming whichever constant sorts first.'
    requirement: FR-ORM-1
    status: implemented
    test: orm/orm_test.go::TestRegistry_RejectsAModelWithNothingToMigrate

  - id: ORM-003
    what: Models() is ordered by table name rather than by registration order.
    why: Registration order follows module registration, which follows FABRIN_MODULES and the argument order in main — none of which should reach a generated migration. Sorting makes the generator's output a function of the schema alone.
    requirement: FR-ORM-1
    status: implemented
    test: orm/orm_test.go::TestRegistry_ModelsIsOrderedByTableRatherThanRegistration

  - id: ORM-004
    what: Field order within a model is preserved exactly as declared.
    why: The generator emits columns from this order, so anything unstable — a map, a sort by name — produces a spurious diff on a project nobody changed. That is how a generator earns a reputation for lying, and it is why table order is sorted while field order is not.
    requirement: FR-ORM-1
    status: implemented
    test: orm/orm_test.go::TestRegistry_KeepsFieldOrderAsDeclared

  - id: ORM-005
    what: Models() returns a deep copy, so a caller cannot mutate the registry through what it was handed.
    why: The registry is read by the migration generator, the admin, and forms. A caller that mutated its result would change the schema every later reader sees, with nothing in between to blame.
    requirement: FR-ORM-1
    status: implemented
    test: orm/orm_test.go::TestRegistry_ModelsReturnsACopy

  - id: ORM-006
    what: The orm package holds no database handle — it may not import database/sql, and a sibling Fabrin package is barred too.
    why: Metadata is a description, and the handle belongs to the application. Nothing else stops this package opening a connection, and the moment it can, the admin needs a database running to render a form and these tests need one to run. Enforced by depguard rather than by review, because the import that breaks it compiles cleanly.
    requirement: FR-ORM-1
    status: implemented
    test: .golangci.yml

  - id: ORM-007
    what: A module declares its tables by implementing Modeler, asserted at registration and reported through App.Capabilities like Checker, Lifecycle, and Commander. Fabrin scans no packages for models.
    why: Django discovers models because a Python import has side effects at runtime. The Go equivalent is a blank import whose absence is silent — and a model that quietly fails to register is a table the migration generator proposes to DROP. Explicit hand-over makes the absence a compile-time one.
    requirement: FR-ORM-3
    status: implemented
    test: modeler_test.go::TestApp_ModelsCollectsEachModulesTablesWithItsName

  - id: ORM-008
    what: Models are collected from MOUNTED modules only, following the same process-slicing rule as readiness checks and commands.
    why: A migrate-only process that mounts one module must not be handed another's models, or it generates DDL for tables this deployment shape has no stake in.
    requirement: FR-ORM-3
    status: implemented
    test: modeler_test.go::TestNew_CollectsModelsFromMountedModulesOnly

  - id: ORM-009
    what: Two mounted modules declaring one table name fail at construction, and the error names both modules and the table while still matching errors.Is against orm.ErrDuplicateTable.
    why: Propagated rather than logged, because New fails on wiring mistakes instead of warning about them. Found later, it is found as a generated migration diffing against the union of two intentions. The wrap must preserve errors.Is or a caller has nothing to branch on but message text.
    requirement: FR-ORM-3
    status: implemented
    test: modeler_test.go::TestNew_RejectsTwoModulesDeclaringOneTable

  - id: ORM-010
    what: A module reaches its data through an interface it declares, and its package imports no database/sql, no driver and no ORM — read off the import graph rather than off behaviour.
    why: ADR 0002 made database/sql the seam and left main the only place that names a concrete store. A module that imports a handle and never calls it passes every request-level assertion, so only the import graph distinguishes "does not import" from "imports and does not call today". The check is an allowlist (standard library plus Fabrin) rather than a list of ORMs to deny, because a prefix deny list fails open against the ORM nobody wrote a rule for; and its floor counts NON-test files, because the module's own _test.go imports Fabrin and would otherwise satisfy a floor that asked only whether any Go was read.
    requirement: FR-ORM-2
    status: implemented
    test: examples/hello/hello_test.go::TestOrders_ImportsNoDatabaseHandleNorAnythingOutsideFabrin

  - id: ORM-011
    what: One store interface, two implementations — the module answers the same requests against an in-memory store in its own tests and against the store main wired in, with no change to the module.
    why: An interface with exactly one implementation forever is a wrapper wearing a disguise. The second implementation is what makes the seam an extraction seam rather than an indirection, and it is what lets the module be exercised with no database running. The in-memory half records its writes because a response body cannot distinguish a handler that went through the port from one that echoed the request back.
    requirement: FR-ORM-2
    status: implemented
    test: examples/hello/orders/orders_test.go::TestModule_ReachesItsDataOnlyThroughTheStoreItWasGiven

  - id: ORM-012
    what: A primary key marked Nullable is rejected at registration - primary keys are NOT NULL by definition.
    why: The two flags on one column contradict each other, and every dialect would either ignore one or refuse - a mystery in the most expensive available place. Part of #79 deciding the provisional flags (ADR 0006): columns are NOT NULL unless Nullable opts out, so the combination became expressible and therefore had to become impossible.
    requirement: FR-ORM-1
    status: implemented
    test: orm/orm_test.go::TestRegistry_RejectsAModelWithNothingToMigrate

  - id: ORM-013
    what: Redundant Unique and Index flags are rejected at registration - UNIQUE already implies an index, and a primary key already implies both uniqueness and an index.
    why: Accepting Unique+Index, PrimaryKey+Unique, or PrimaryKey+Index would freeze redundant DDL into generated migrations forever, presented as a tuning hint when it is a misunderstanding. Same decision, same ADR.
    requirement: FR-ORM-1
    status: implemented
    test: orm/orm_test.go::TestRegistry_RejectsAModelWithNothingToMigrate

  - id: ORM-014
    what: Every public column-type constant is prefixed with Type and retains its stable serialized value.
    why: Bare names such as orm.Time are easy to confuse with time.Time and break the repository's established enum naming convention. Prefixing the names before v1 makes call sites self-describing while retaining the state-file vocabulary already written to disk.
    requirement: FR-ORM-1
    status: implemented
    test: orm/orm_test.go::TestType_PrefixedConstantsAreValidAndKeepTheirWireValues

  - id: ORM-015
    what: Generator Go names survive registry collection but are omitted from migration state.
    why: One declaration must feed both generated source and schema metadata, while a Go-only rename must not produce a database migration or change the state-file format.
    requirement: FR-ORM-6
    status: implemented
    test: orm/state_test.go::TestSnapshot_LeavesGeneratorNamesOutOfMigrationState

  - id: ORM-016
    what: The same model declarations produce byte-identical, gofmt-formatted, compiling PostgreSQL Create/Get source with typed nullable fields and quoted identifiers.
    why: Generated code is reviewed and checked in. Nondeterminism creates false diffs, uncompiled text moves failure into an application build, and unquoted metadata turns identifiers into SQL syntax.
    requirement: FR-ORM-6
    status: implemented
    test: ormgen/ormgen_test.go::TestGenerate_ProducesDeterministicCompilingPostgreSQLCreateAndGet

  - id: ORM-017
    what: Invalid or colliding package, model, field, table, and column names plus unsupported primary-key shapes fail before generation returns any output.
    why: A generator that writes a partial file before discovering an ambiguous declaration leaves the project broken and makes the real schema error harder to find.
    requirement: FR-ORM-6
    status: implemented
    test: ormgen/ormgen_test.go::TestGenerate_RejectsInvalidOrCollidingNamesBeforeOutput

  - id: ORM-018
    what: Generated queries accept *sql.DB, *sql.Tx, and *sql.Conn without adapters.
    why: Transactions and pinned connections must use the same generated methods as the pool; requiring a framework database wrapper would reverse ADR 0002 and widen the public seam.
    requirement: FR-ORM-6
    status: implemented
    test: internal/ormgentest/orderdb/orderdb_test.go::TestDBTX_IsSatisfiedByDBTxAndConn

  - id: ORM-019
    what: Generated Create/Get methods round-trip typed rows and SQL NULL, quote every identifier, and preserve sql.ErrNoRows for errors.Is.
    why: Null collapse corrupts data, unquoted names can change SQL meaning, and callers need to distinguish a missing row from a failed database without parsing error text.
    requirement: FR-ORM-6
    status: implemented
    test: internal/ormgentest/orderdb/orderdb_test.go::TestQueries_CreateAndGetPreserveNullsAndQuoteIdentifiers

  - id: ORM-020
    what: Cancellation reaches generated database calls and remains discoverable as context.Canceled.
    why: Request cancellation is a resource bound. Dropping or replacing it makes abandoned queries consume a shared pool after their caller is gone.
    requirement: FR-ORM-6
    status: implemented
    test: internal/ormgentest/orderdb/orderdb_test.go::TestQueries_HonorCancellation

  - id: ORM-021
    what: Generated Create/Get code is exercised against a live PostgreSQL server when FABRIN_TEST_PG_DSN is set and otherwise skips with a visible notice.
    why: Parsing SQL or accepting it in SQLite cannot prove PostgreSQL accepts its placeholders, BYTEA and TIMESTAMPTZ values, or scan behavior. The environment switch keeps the ordinary suite hermetic while preserving exact production-database evidence.
    requirement: FR-ORM-6
    status: implemented
    test: internal/ormgentest/orderdb/orderdb_test.go::TestQueries_CreateAndGetAgainstPostgreSQL

  # ── Migrations ──────────────────────────────────────────────────────────────
  - id: MIG-001
    what: A migration's body and the row recording it are written in one transaction, so a failure leaves both the schema and the applied-state table where they started.
    why: Recording the version outside the transaction is the classic form of this bug — the migration half-runs, the row says it finished, and every later run skips the half that never happened. Migrations that already committed stay applied, and the error names which migration failed so the operator is not guessing at the database's state.
    requirement: FR-ORM-4
    status: implemented
    test: migrate/migrate_test.go::TestRun_LeavesNothingBehindWhenAMigrationFails

  - id: MIG-002
    what: An unapplied migration sorting before one already applied is an error, and nothing is applied.
    why: That is the shape of a branch merged out of order — someone's 002 lands after 003 is already in production. Applying it silently would run it against a schema it was never written against, and the diff it assumed is not the diff it gets. Distinct from FR-ORM-5, which is about two migrations claiming ONE version; this is about one version arriving late.
    requirement: FR-ORM-4
    status: implemented
    test: migrate/migrate_test.go::TestRun_RejectsAMigrationOrderedBeforeOneAlreadyApplied

  - id: MIG-003
    what: Migrations apply in version order regardless of slice order, and applying is idempotent — already-applied migrations are skipped rather than re-run.
    why: 'A caller that globs a directory gets whatever the filesystem returns, which is not a total order. Idempotence is what makes a redeploy safe: an empty result means already up to date, which is the normal case and not an error.'
    requirement: FR-ORM-4
    status: implemented
    test: migrate/migrate_test.go::TestRun_AppliesPendingMigrationsInVersionOrder

  - id: MIG-004
    what: A migration set with a duplicate version, no version, no Up, or no Down is rejected before anything is applied.
    why: A down step is required rather than optional — a migration you cannot reverse is a deploy you cannot roll back, and the moment you need it is the worst moment to find out nobody wrote one. An irreversible change says so from Down, which is a decision recorded in the file rather than an omission.
    requirement: FR-ORM-4
    status: implemented
    test: migrate/migrate_test.go::TestRun_RejectsAnUnusableMigrationSet

  - id: MIG-005
    what: Rollback undoes applied migrations newer than an exclusive target version, newest first, each in its own transaction, and fails rather than skipping a recorded version it has no Down for.
    why: Reverse order because a later migration may depend on an earlier one — undoing 001 before 003 removes what 003's own Down still needs. Skipping a version with no migration in hand would report success while leaving the schema ahead of where the caller asked to be.
    requirement: FR-ORM-4
    status: implemented
    test: migrate/migrate_test.go::TestRollback_UndoesInReverseOrder

  - id: MIG-007
    what: Two migrations claiming one version are rejected before anything is applied, and the error names both.
    why: With several branches in flight this is a matter of when, not if. The engine half is here; the repo-level gate that catches it on the files before they are merged is separate, which is why FR-ORM-5 is not yet done.
    requirement: FR-ORM-5
    status: implemented
    test: migrate/migrate_test.go::TestRun_RejectsAnUnusableMigrationSet

  - id: MIG-008
    what: A repo-level gate, hanging off an existing just recipe, rejects two migration files claiming one version and names both files and the version.
    why: MIG-007 catches the collision at deploy time, against a database, which is the most expensive moment to find it. Two branches each generating an 0004 are both green in isolation, so the only cheap moment is before merge. The gate reads FILES rather than a registry built by running Go code, so a colliding migration on a branch that does not compile is still caught - it needs no compiler, only the filename-equals-version contract MIG-033 established. It also rejects mixed widths across the whole set and malformed prefixes, because lexicographic ordering on either applies migrations in an order nobody wrote.
    requirement: FR-ORM-5
    status: implemented
    test: scripts/gates/check-migration-versions.sh

  - id: MIG-009
    what: A migration set whose versions do not sort as written - mixed-width versions such as 9 and 10 - is rejected before anything is applied, and the error names both.
    why: M documents lexicographic ordering and therefore requires a fixed-width version, but nothing enforces it. Such a set is accepted, reordered into a sequence its author did not write, and applied against a schema each half never saw. Both versions are named because the fault is in the pair - 9 is unimpeachable next to 8. Cites FR-ORM-4 (versioned, ORDERED) rather than FR-ORM-5 although it arrived via issue #55 - these are two distinct versions, neither claiming the other's, so it is an ordering property like MIG-002 and not a collision.
    requirement: FR-ORM-4
    status: implemented
    test: migrate/migrate_test.go::TestRun_RejectsVersionsThatDoNotSortAsWritten

  - id: MIG-010
    what: M.Up and M.Down take a migrate.Handle - an exported interface of exactly four methods (ExecContext, QueryContext, QueryRowContext, PrepareContext) satisfied unmodified, with no adapter, by *sql.Tx, *sql.DB and *sql.Conn.
    why: '*sql.Tx answers "may a migration run outside a transaction?" with no, by construction and silently. CREATE INDEX CONCURRENTLY forces the question - PostgreSQL refuses it inside a transaction block - and Django ships Migration.atomic = False for it. The engine still passes a transaction today, so MIG-001 is unchanged; the TYPE stops promising one, so NonAtomic can land later with no edit to any user migration. The method set is the irreversible half: users implement Handle with recording fakes, so a fifth method after v0.1 breaks all of them, and the plausible fifth is one *sql.Tx already has - which a compile-time satisfaction check cannot see. Read by reflection for that reason. The interface restricts nothing: h.(*sql.Tx).Rollback() still compiles, so this converts an accident into a deliberate act rather than removing the ability. The dynamic type is deliberately NOT part of the contract and is not asserted anywhere - asserting it would foreclose the wrapper the change exists to permit. See docs/adr/0003-migrations-take-a-handle-not-a-transaction.md.'
    requirement: FR-ORM-4
    status: implemented
    test: migrate/handle_test.go::TestHandle_MethodSetIsFrozenAtFourAndSatisfiedUnmodifiedByTxDBAndConn

  - id: MIG-011
    what: Recorded model state round-trips - snapshot to bytes back to snapshot preserves every table, the module that declared it, and each column in its declared order.
    why: makemigrations diffs the live registry against the state reconstructed from recorded migrations. Any loss on the round trip becomes a generated migration against a schema the user never wrote, which is the most expensive way to discover the format dropped something.
    requirement: FR-ORM-4
    status: implemented
    test: orm/state_test.go::TestSnapshot_RoundTripsThroughEncodeAndParse

  - id: MIG-012
    what: Encoding one schema twice produces identical bytes, and construction order cannot reach them.
    why: A generated migration that differs between two runs on an unchanged project is a spurious diff nobody can review honestly. Table order comes from the schema alone, never from registration order, map iteration, or the phase of the moon.
    requirement: FR-ORM-4
    status: implemented
    test: orm/state_test.go::TestSnapshot_EncodeIsDeterministic

  - id: MIG-013
    what: Recorded state has an explicit version and preserves Nullable, Unique, and Index through snapshot construction, encoding, and parsing.
    why: ADR 0006 made the flags schema semantics. Losing one from migration state makes the next diff compare against a schema the previous migration did not create; the version marker prevents future meaning changes from being guessed silently.
    requirement: FR-ORM-4
    status: implemented
    test: orm/state_test.go::TestSnapshot_EncodesConstraintFlagsInVersionedState

  - id: MIG-039
    what: Unversioned pre-ADR-0006 state decodes every non-primary column as nullable and all withheld constraint flags as false.
    why: That is the DDL the old generator actually emitted. Applying today's NOT NULL zero value retroactively would hide the required transition; rejecting every existing file would throw away accurate information the legacy format already implies.
    requirement: FR-ORM-4
    status: implemented
    test: orm/state_test.go::TestParseSnapshot_DecodesLegacyConstraintSemantics

  - id: MIG-040
    what: A marked state-format version this build does not understand fails closed, wrapping ErrBadState and naming the source and version.
    why: Reading a future meaning with today's field set would silently discard schema information and poison every later diff. Legacy absence is the one explicit compatibility case, not permission to guess unknown versions.
    requirement: FR-ORM-4
    status: implemented
    test: orm/state_test.go::TestParseSnapshot_RejectsUnknownStateVersion

  - id: MIG-041
    what: Dialect has exactly Name and one stable Render(Operation) method; Render returns an ordered statement list, and Apply executes every statement after preflighting every operation.
    why: A method per operation makes every new built-in operation a compile-time break for every custom dialect. One intent-to-statements method lets the operation vocabulary grow without interface churn and permits operations that honestly require more than one statement.
    requirement: FR-ORM-4
    status: implemented
    test: migratediff/migratediff_test.go::TestDialect_HasOneStableRenderMethodForAllOperations

  - id: MIG-043
    what: PostgreSQL and SQLite quote table and column metadata as identifiers, including embedded quotes, instead of interpolating names as SQL fragments.
    why: Raw identifier interpolation makes valid names fail and turns developer-controlled metadata into executable SQL syntax. Identifier quoting preserves the literal name and keeps generated DDL structurally separate from metadata.
    requirement: FR-ORM-4
    status: implemented
    test: migratediff/migratediff_test.go::TestDialects_QuoteIdentifiersInsteadOfTreatingThemAsSQL

  - id: MIG-044
    what: Type, length, nullability, and constraint changes on one field are diffed independently, so one change cannot mask another.
    why: A switch over field differences emitted only the first matching change. A migration that changed a type and added UNIQUE, for example, recorded the final state while creating only half of it and poisoned every later diff.
    requirement: FR-ORM-4
    status: implemented
    test: migratediff/migratediff_test.go::TestDiff_EmitsEveryIndependentChangeOnAField

  - id: MIG-045
    what: Primary-key and plain-index additions and removals are explicit operations ordered with dependent drops before additions.
    why: A primary-key swap must remove the old key before adding the new one, and an index-to-constraint transition must remove the redundant object first. Stable dependency order makes the emitted migration executable and reviewable.
    requirement: FR-ORM-4
    status: implemented
    test: migratediff/migratediff_test.go::TestDiff_DetectsIndexAndPrimaryKeyChanges

  - id: MIG-046
    what: Generated primary-key, UNIQUE, and index names are deterministic, at most 63 bytes, and distinguish ambiguous or truncated table/column joins.
    why: PostgreSQL silently truncates longer identifiers, while raw underscore joins collide. A readable prefix plus a digest over length-delimited originals makes a later drop name the object the earlier migration created.
    requirement: FR-ORM-4
    status: implemented
    test: migratediff/migratediff_test.go::TestGeneratedObjectNamesAreBoundedAndCollisionResistant

  - id: MIG-047
    what: PostgreSQL renders NOT NULL, named primary-key and UNIQUE constraints, and plain indexes when creating a table or adding a column.
    why: Constraint metadata that survives state but not initial DDL is false schema state. Multi-statement rendering is what lets one added column create its separately named constraint or index without collapsing intent into raw SQL.
    requirement: FR-ORM-4
    status: implemented
    test: migratediff/migratediff_test.go::TestPostgres_RendersCompleteConstraintsForNewTablesAndColumns

  - id: MIG-048
    what: PostgreSQL renders later nullability, primary-key, UNIQUE, and index transitions with stable names; primary-key drops identify legacy or generated keys through the catalog.
    why: Pre-ADR inline primary keys received server-assigned names that cannot be reconstructed from the new naming rule. Looking up the actual single-column key preserves reversibility without guessing or dropping an unrelated constraint.
    requirement: FR-ORM-4
    status: implemented
    test: migratediff/migratediff_test.go::TestPostgres_RendersConstraintTransitionsWithStableNames

  - id: MIG-049
    what: SQLite creates initial named constraints and indexes, supports nullable indexed column additions, and refuses non-null or constraint additions that need an unimplemented table rebuild.
    why: SQLite can express the initial schema but not every alteration. A stated preflight refusal is safer than a generated migration that fails after earlier statements have already mutated the schema.
    requirement: FR-ORM-4
    status: implemented
    test: migratediff/migratediff_test.go::TestSQLite_RendersInitialConstraintsAndRefusesUnsupportedAdditions

  - id: MIG-050
    what: makemigrations recognizes pgx by its driver package, emits every PostgreSQL statement group, and reverses operation groups for Down without reversing statements inside one operation.
    why: pgx's concrete type is named stdlib.Driver, so matching only the displayed type rejected a supported driver. Flat reversal also breaks multi-statement operations and primary-key swaps during rollback.
    requirement: FR-ORM-4
    status: implemented
    test: makemigrations_test.go::TestExecute_MakemigrationsRendersIndependentPostgresChangesAndReversesGroups

  - id: MIG-051
    what: A generated migration advances one second past a recorded version from the current clock second instead of failing with a collision.
    why: Two real schema changes can be generated within one second. Equality is the ordinary fast-run case, not an unrecoverable clock error; the same jump rule already handles future-dated recorded versions.
    requirement: FR-ORM-4
    status: implemented
    test: makemigrations_internal_test.go::TestNextVersionAdvancesPastARecordedVersionFromTheCurrentSecond

  - id: MIG-052
    what: When one makemigrations run emits migrations for several modules, each state sidecar records the cumulative full schema produced after that version, and replay reaches the declared final schema.
    why: Writing the run's final snapshot beside every migration lets an earlier version claim changes owned by a later one. Recorded state must describe the schema that actually exists at that point in the ordered chain or every later diff starts from fiction.
    requirement: FR-ORM-4
    status: implemented
    test: makemigrations_test.go::TestExecute_MakemigrationsRecordsCumulativeStatePerModuleMigration

  - id: MIG-053
    what: RenameColumn is an explicit schema operation rendered with quoted identifiers by PostgreSQL and SQLite, and SQLite execution preserves the column's data.
    why: A rename is observably different from drop-plus-add because the latter destroys every value. It belongs in the operation vocabulary so generated migrations and custom dialects can express that intent without raw SQL.
    requirement: FR-ORM-4
    status: implemented
    test: migratediff/migratediff_test.go::TestSQLite_RenamesAColumnWithoutLosingItsData

  - id: MIG-054
    what: Confirming a compatible drop/add pair generates one reversible column rename instead of a drop and add.
    why: A schema diff cannot infer identity from two names, but a user can. Asking preserves data without teaching the pure differ to guess.
    requirement: FR-ORM-4
    status: implemented
    test: makemigrations_internal_test.go::TestRunMakemigrations_ConfirmedRenameGeneratesReversibleSQL

  - id: MIG-055
    what: Declining a possible rename generates the original drop and add, with the data-loss warning carried in the migration file.
    why: No is a deliberate answer that the two fields have different identities. The destructive consequence must remain visible at review time rather than only in command output.
    requirement: FR-ORM-4
    status: implemented
    test: makemigrations_internal_test.go::TestRunMakemigrations_DeclinedRenameGeneratesDropAndAdd

  - id: MIG-056
    what: -no-input and non-terminal generation refuse a possible rename before writing any files, naming both columns.
    why: CI and pipes have nobody present to authorize drop-plus-add. Defaulting to no there would silently choose the data-destroying interpretation.
    requirement: FR-ORM-4
    status: implemented
    test: makemigrations_test.go::TestExecute_MakemigrationsNoInputRefusesPossibleRenameBeforeWriting

  - id: MIG-057
    what: Several compatible dropped and added fields are presented as individual rename questions rather than matched collectively.
    why: Type compatibility does not establish identity. A bulk guess becomes less trustworthy as candidates multiply, so each possible pair needs its own explicit answer.
    requirement: FR-ORM-4
    status: implemented
    test: makemigrations_internal_test.go::TestResolveRenames_AsksAmbiguousCandidatesOneAtATime

  - id: MIG-058
    what: Confirming a primary-key, UNIQUE, or indexed column rename refuses with a hand-written-migration instruction until generated database-object names can be updated safely.
    why: Renaming only the column preserves its data but leaves ADR 0006's deterministic constraint or index name tied to the old column, breaking later generated drops. A stated refusal is safer than recording false schema identity.
    requirement: FR-ORM-4
    status: implemented
    test: makemigrations_internal_test.go::TestResolveRenames_ConfirmedConstrainedColumnRequiresHandWrittenMigration

  - id: MIG-014
    what: Unreadable recorded state is an error wrapping ErrBadState and naming the source it came from.
    why: A state record nobody can parse must never become a silently empty "before" - which would make the next makemigrations emit a create-everything migration against a live schema. "Unparseable" without a file name sends the reader grepping a directory.
    requirement: FR-ORM-4
    status: implemented
    test: orm/state_test.go::TestParseSnapshot_ErrorsNameTheirSource

  - id: MIG-015
    what: Recorded state carrying keys this version does not know is rejected, not read with those keys dropped.
    why: encoding/json ignores unknown fields by default, which is exactly wrong here - a newer-format or hand-edited file read silently with its extra information discarded would make the next generated migration diff against an impoverished state. Failing loud is the fail-closed answer.
    requirement: FR-ORM-4
    status: implemented
    test: orm/state_test.go::TestParseSnapshot_RejectsKeysItDoesNotKnow

  - id: MIG-016
    what: Parsed state is revalidated through the same rules Registry.Register applies - an unknown type, two primary keys, a duplicate column, or no fields fails with table-and-field context.
    why: Bytes from disk are untrusted in exactly the sense registration input is. A corrupted or hand-mangled file must fail here instead of poisoning every later diff with a schema that could not exist.
    requirement: FR-ORM-4
    status: implemented
    test: orm/state_test.go::TestParseSnapshot_RevalidatesWhatItReads

  - id: MIG-017
    what: Replaying a step chain carries hand-written migrations' last known state forward, starts empty when nothing is recorded yet, and reconstructs byte-for-byte identically from the same files.
    why: Hand-written migrations carry no recorded state because Fabrin has no operation vocabulary to fold; carrying forward is the stated rule rather than refusing the chain, so generated and hand-written migrations can coexist. Reconstruction touches no database - generating a migration has to work on a laptop with nothing running.
    requirement: FR-ORM-4
    status: implemented
    test: orm/state_test.go::TestReplayState_IsDeterministicAndCarriesHandWrittenStepsForward

  - id: MIG-018
    what: A replay chain whose versions repeat, descend, or include an empty version is rejected.
    why: Steps arrive ordered off disk, and a chain that repeats or reverses is a corrupted directory presenting itself as history - replaying it would reconstruct some other project's timeline and present it as truth to the differ.
    requirement: FR-ORM-4
    status: implemented
    test: orm/state_test.go::TestReplayState_RejectsBrokenSequences

  - id: MIG-019
    what: The differ detects each shape of schema change - new table, dropped table, added field, dropped field, changed type, changed length - as one operation each.
    why: This is the seam makemigrations stands on. Each shape is its own operation because they render differently and fail differently; a differ that collapsed them would generate migrations nobody could review operation by operation. Lives in an unexported package on the admin-proof terms (ADR 0005) until #59 freezes the public seam deliberately.
    requirement: FR-ORM-4
    status: implemented
    test: migratediff/migratediff_test.go::TestDiff_DetectsEachShapeOfChange

  - id: MIG-020
    what: Diffing a state against itself emits nothing - makemigrations on an unchanged project says "no changes" rather than writing a file full of nothing.
    why: An empty diff is the normal case on a redeploy. A generator that emitted empty migrations on every run would train users to ignore its output, which is how a real change eventually ships unnoticed inside noise.
    requirement: FR-ORM-4
    status: implemented
    test: migratediff/migratediff_test.go::TestDiff_EmitsNothingWhenStatesAgree

  - id: MIG-021
    what: The diff is deterministic and ordered - creates sorted by table first, alterations per surviving table with columns sorted and drops before retypes before additions, whole-table drops last; same inputs, same ops, every run.
    why: The generated migration inherits whatever wiggle the differ allows. Ordering left to map iteration produces migrations that differ between runs on an unchanged project and reviews terribly; the order is chosen once, here, so data loss clusters where a reviewer reads it.
    requirement: FR-ORM-4
    status: implemented
    test: migratediff/migratediff_test.go::TestDiff_IsDeterministicAndOrdersItsOps

  - id: MIG-022
    what: Reordering a model's declared field list produces no operations.
    why: DDL cannot reorder columns without rebuilding the table, and the registry preserves declared order as layout intent. Inventing a drop-and-re-add for a cosmetic diff would destroy data - the one outcome no generator may cause silently.
    requirement: FR-ORM-4
    status: implemented
    test: migratediff/migratediff_test.go::TestDiff_TreatsAReorderedFieldListAsNoChange

  - id: MIG-023
    what: Emitted DDL is executed against a real database - SQLite in-process creates tables that accept rows.
    why: A dialect that renders plausible SQL nobody's server accepts is worse than none. Eyeballing SQL proves syntax at best; executing it proves the dialect.
    requirement: FR-ORM-4
    status: implemented
    test: migratediff/migratediff_test.go::TestSQLite_CreatesTablesThatAcceptRows

  - id: MIG-024
    what: SQLite refuses column drops and type changes with a stated error wrapping errUnsupported, naming the dialect - before anything executes.
    why: SQLite cannot alter or drop a column in place. The honest options are the documented table-rebuild dance or a stated refusal; this iteration refuses, from render, never halfway through a live migration. Emitting SQL that fails mid-migration is the worst place to discover a dialect limit.
    requirement: FR-ORM-4
    status: implemented
    test: migratediff/migratediff_test.go::TestSQLite_RefusesColumnDropAndRetypeWithStatedErrors

  - id: MIG-025
    what: PostgreSQL DDL is verified against a live server when FABRIN_TEST_PG_DSN is set, and skipped WITH a notice when it is not - never silently passing either way.
    why: Postgres is what people deploy, so its dialect must be more than plausible. Skipping quietly when unconfigured keeps the hermetic gate hermetic; the notice keeps the skip visible to anyone reading verbose output, so an always-skipped check cannot masquerade as a passing one forever.
    requirement: FR-ORM-4
    status: implemented
    test: migratediff/migratediff_test.go::TestPostgres_RendersDDLThatALiveServerAccepts

  - id: MIG-026
    what: A dropped column's statement carries its data-loss warning as a SQL comment naming the column.
    why: Dropping a column destroys whatever it held, and that is exactly the line a reviewer must not skim past. It rides in the emitted SQL - where the generated migration file carries it - rather than in a log nobody diffs.
    requirement: FR-ORM-4
    status: implemented
    test: migratediff/migratediff_test.go::TestDataLossIsStatedInTheEmittedSQL

  - id: MIG-027
    what: A module declares its migrations through the optional Migrator interface, collected from mounted modules only, and reported through Capabilities.
    why: The counterpart of Modeler - the models say what the schema IS, the migrations say how it got there. Nothing scans for them at runtime; makemigrations generates files into the owning module's directory and the module returns them by hand, so an unregistered migration is a compile-time absence rather than a silent one.
    requirement: FR-ORM-4
    status: implemented
    test: migrator_test.go::TestApp_ReportsMigratorCapability

  - id: MIG-028
    what: Two modules claiming one migration version fail at construction, wrapping ErrDuplicateVersion and naming both modules.
    why: Two branches each generating the same timestamped version are both green in isolation and collide only when their modules meet in one binary. The engine would catch it at deploy time against a database - construction is cheaper, and naming both sides makes it fixable without grepping.
    requirement: FR-ORM-4
    status: implemented
    test: migrator_test.go::TestNew_RejectsTwoModulesClaimingOneMigrationVersion

  - id: MIG-029
    what: Migrations of unequal version width across modules fail at construction, wrapping ErrInvalidMigration.
    why: The collected union runs as ONE set, and lexicographic ordering on mixed widths applies migrations in an order their authors did not write. Found at wiring time rather than against a schema each half never saw.
    requirement: FR-ORM-4
    status: implemented
    test: migrator_test.go::TestNew_RejectsMigrationsOfMixedWidthsAcrossModules

  - id: MIG-030
    what: The migrate command applies pending migrations in version order against Options.DB, prints each applied version and name, and on a second run says up to date instead of printing nothing.
    why: A migrate job's whole value is knowing what state the schema ended in - silence after a job reads as failure. The database is main's choice (ADR 0002); Fabrin opens nothing and refuses with an error naming Options.DB when no handle was handed over.
    requirement: FR-ORM-4
    status: implemented
    test: migrator_test.go::TestExecute_MigrateAppliesPendingMigrationsAndSaysSo

  - id: MIG-031
    what: With -to, migrate moves to that version - forward applying everything up to and including it, backward rolling back to an exclusive target - and states the direction before acting.
    why: A deploy landing halfway between versions is normal, not exotic, and rollback must not re-run forward steps to get there. Direction is decided by reading the applied-state table first and printed before anything runs, because an undocumented direction is a deploy incident waiting for its moment.
    requirement: FR-ORM-4
    status: implemented
    test: migrator_test.go::TestExecute_MigrateToRollsBackToAnExclusiveTarget

  - id: MIG-032
    what: Migration commands refuse outright when the process is sliced by FABRIN_MODULES, naming registered versus mounted.
    why: A sliced process holds a subset of the schema, and acting from a subset would half-migrate the shared database - or, for makemigrations, propose dropping every table whose module was selected out. FABRIN_MODULES is route selection, never schema selection; refusing names the cause and the fix.
    requirement: FR-ORM-4
    status: implemented
    test: migrator_test.go::TestExecute_MigrateRefusesWhenTheProcessIsSliced
  - id: MIG-033
    what: makemigrations writes one migration per changed module into that module's migrations directory - a compiling, gofmt-clean Go file whose filename prefix is its version (fixed-width timestamp), a state sidecar in the #56 codec recording the full schema the version yields, a manifest ordering them, and a generated all.go aggregating what the module's Migrator returns.
    why: The on-disk format everything downstream waits for. Filename-equals-version makes the duplicate-version gate readable without compiling; the sidecar being DATA means a non-compiling branch still diffs; regenerating all.go from the manifest rather than scanning source cannot silently lose a hand-written migration. The generated Go is type-checked in a temporary module because parser acceptance alone misses unresolved imports and other code that is valid syntax but cannot build.
    requirement: FR-ORM-4
    status: implemented
    test: makemigrations_test.go::TestExecute_MakemigrationsGeneratesFilesForANewTable

  - id: MIG-034
    what: Running makemigrations on an unchanged project says "no changes" and rewrites no files.
    why: An empty diff is the normal case on a redeploy. A generator that rewrote files on every run produces spurious review noise until somebody stops reading it - which is how a real change eventually ships unnoticed.
    requirement: FR-ORM-4
    status: implemented
    test: makemigrations_test.go::TestExecute_MakemigrationsTwiceSaysNoChanges

  - id: MIG-035
    what: Recorded state that exists but does not parse fails makemigrations loudly, wrapping orm.ErrBadState and naming the file.
    why: A corrupted record must never become a silently empty "before" - that is the create-everything-against-a-live-schema disaster, and it is discovered at deploy time unless it fails at generation time.
    requirement: FR-ORM-4
    status: implemented
    test: makemigrations_test.go::TestExecute_MakemigrationsRefusesUnparsableRecordedState

  - id: MIG-036
    what: A hand-written migration - registered in the manifest with NO state file - carries the last known state forward, so the next generated diff runs against reality instead of against nothing.
    why: Fabrin has no operation vocabulary to fold free-form SQL into schema state; refusing such chains would make hand-written and generated migrations unable to coexist. The test also pins the failure mode of getting this wrong - recreating existing tables.
    requirement: FR-ORM-4
    status: implemented
    test: makemigrations_test.go::TestExecute_MakemigrationsCarriesHandWrittenStepsForward

  - id: MIG-037
    what: When two modules change in one run, each gets its own migration file and its own distinct version.
    why: Ownership comes free from the registry, one file per owner keeps review attributable, and two files claiming one version would be rejected by the engine the engine rejects duplicates - each file's Down must be undoable on its own anyway.
    requirement: FR-ORM-4
    status: implemented
    test: makemigrations_test.go::TestExecute_MakemigrationsGivesEachOwningModuleItsOwnMigration

  - id: MIG-038
    what: makemigrations refuses outright when the process is sliced by FABRIN_MODULES, naming registered versus mounted.
    why: Same refusal as migrate, sharper consequence here - a subset diff would propose DROPPING every table whose module was selected out. Route selection is never schema selection.
    requirement: FR-ORM-4
    status: implemented
    test: makemigrations_test.go::TestExecute_MakemigrationsRefusesWhenTheProcessIsSliced

  - id: MIG-042
    what: Apply renders and validates every schema operation before executing the first statement, so a later unsupported operation leaves the database untouched.
    why: Rendering and executing in one loop made the documented fail-before-mutation contract false - a valid early operation committed before SQLite rejected a later drop or retype. Preflight cannot make arbitrary execution failures atomic, but it must discover dialect limits before touching the schema.
    requirement: FR-ORM-4
    status: implemented
    test: migratediff/migratediff_test.go::TestApply_PreflightsEveryOperationBeforeMutating

  - id: MIG-006
    what: The migration engine takes a *sql.DB and imports no driver, no Gin, and no net/http, so migrations run from a process that mounts no routes.
    why: A migrate-only process is a deployment shape Fabrin promises, and an engine that dragged in a transport would make the smallest useful migration container carry an HTTP stack it never binds. The driver belongs to the application; Fabrin's own test driver is barred from the shipped code by the same rule that permits it in the tests.
    requirement: FR-ORM-4
    status: implemented
    test: .golangci.yml

  # ── Admin seam proof ───────────────────────────────────────────────────────
  - id: ADM-001
    what: One unexported admin resource flows a concrete Go value through Fabrin model metadata, metadata-derived form fields, and resource-specific create, list, update, and delete persistence callbacks without reflection or a public repository contract.
    why: The metadata registry describes tables but cannot construct Go values, while consumer-owned stores deliberately expose no generic CRUD. A real vertical must prove the minimum link before Fabrin freezes a public model, form, or repository seam.
    requirement: FR-ADMIN-5
    status: implemented
    test: admin/admin_test.go::TestResource_CRUDFlowsFromMetadataFormsToPersistence

  - id: ADM-002
    what: Every private admin resource requires authorization and CSRF callbacks; an unsafe create, update, or delete validates CSRF and then authorization before binding a field or calling persistence.
    why: A future admin is a privileged write surface. Making either gate optional or checking it after binding lets a registration mistake become a bypass and lets rejected input reach code it never needed to touch.
    requirement: FR-ADMIN-5
    status: implemented
    test: admin/admin_test.go::TestResource_UnsafeActionsFailClosedBeforeBindingOrPersistence

  - id: ADM-003
    what: Metadata field order and length constraints plus explicit type adapters produce private field errors, retain submitted values, and skip persistence when binding fails.
    why: The vertical must prove a form boundary rather than merely call CRUD callbacks. Keeping errors attached to the metadata allowlist prevents unknown-field mass assignment and gives the future renderer deterministic state without exporting a premature forms API.
    requirement: FR-ADMIN-5
    status: implemented
    test: admin/admin_test.go::TestResource_FormErrorsStayWithMetadataFieldsAndSkipPersistence
